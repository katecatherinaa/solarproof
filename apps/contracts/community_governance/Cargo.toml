[package]
name = "community-governance"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
energy-token = { path = "../energy_token" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
energy-token = { path = "../energy_token" }
