name: Load Test — POST /api/readings

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Target API URL'
        required: true
        default: 'https://solarproof-staging.vercel.app'
      meter_id:
        description: 'Seeded meter UUID (leave blank for placeholder mode)'
        required: false
        default: ''
      scenario:
        description: 'Test scenario: baseline (100 VUs, p95 < 500ms) or breakpoint (ramp to breaking point)'
        required: false
        default: 'baseline'
        type: choice
        options:
          - baseline
          - breakpoint
  schedule:
    # Nightly run against staging for automated P95 regression detection
    - cron: '0 2 * * *'   # Every day at 02:00 UTC
    # Weekly broader run on Monday morning (kept for breakpoint analysis)
    - cron: '0 4 * * 1'   # Every Monday at 04:00 UTC

env:
  # P95 baseline from docs/PERFORMANCE_BASELINE.md (milliseconds)
  P95_BASELINE_MS: 2000
  # Regression threshold: fail if P95 exceeds baseline by more than 20%
  P95_REGRESSION_PERCENT: 20

jobs:
  verify-rate-limit:
    name: Verify rate limit enforcement (/api/verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Run verify rate-limit test
        id: run_verify_test
        run: |
          # Burst more than 30 requests within a minute and assert 429s are returned
          k6 run tests/load/verify-rate-limit.js \
            -e API_URL=${{ github.event.inputs.api_url || 'https://solarproof-staging.vercel.app' }} \
            --summary-export=verify-rate-limit-summary.json || true

      - name: Enforce 429 threshold
        id: enforce_threshold
        run: |
          RESULT=$(python3 -c "
          import json, sys
          try:
              with open('verify-rate-limit-summary.json') as f:
                  data = json.load(f)
              metrics = data.get('metrics', {})
              rate_limited = metrics.get('verify_rate_limited', {}).get('count')
              if rate_limited is None:
                  rate_limited = metrics.get('checks', {}).get('passes')
              if rate_limited is None:
                  print('N/A')
                  sys.exit(0)
              print(int(rate_limited))
          except Exception as e:
              print(f'ERROR: {e}', file=sys.stderr)
              print('N/A')
          " 2>&1)

          echo "rate_limited=${RESULT}" >> "$GITHUB_OUTPUT"

          if [ "$RESULT" = "N/A" ] || [ "$RESULT" = "" ]; then
            echo "::error::Could not parse rate-limit results from k6 summary — cannot confirm 30 req/min enforcement"
            exit 1
          fi

          if [ "$RESULT" -lt 1 ]; then
            echo "::error::No 429 responses observed — rate limit (30 req/min per IP) is NOT enforced"
            exit 1
          fi

          echo "✅ Rate limit enforced: observed ${RESULT} rate-limited (429) responses"

      - name: Add Rate Limit Summary
        if: always()
        run: |
          RATE_LIMITED="${{ steps.enforce_threshold.outputs.rate_limited }}"
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Verify Rate Limit Test

          | Metric | Value |
          |---|---|
          | Target | ${{ github.event.inputs.api_url || 'https://solarproof-staging.vercel.app' }} |
          | Expected limit | 30 req/min per IP |
          | 429 responses observed | ${RATE_LIMITED:-N/A} |

          > Abuse protection documented in [docs/ABUSE_PROTECTION.md](../../docs/ABUSE_PROTECTION.md).
          EOF

      - name: Upload verify rate-limit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-rate-limit-results-${{ github.run_id }}
          path: verify-rate-limit-summary.json
          if-no-files-found: ignore
          retention-days: 30

  certificate-retirement:
    name: k6 concurrent certificate retirement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Run concurrent retirement test
        id: run_retirement_test
        run: |
          # 50 VUs attempt to retire the same certificate simultaneously
          k6 run tests/load/certificate-retirement.js \
            -e API_URL=${{ github.event.inputs.api_url || 'https://solarproof-staging.vercel.app' }} \
            --summary-export=certificate-retirement-summary.json || true

      - name: Enforce retirement thresholds
        id: enforce_retirement
        run: |
          RESULT=$(python3 -c "
          import json, sys
          try:
              with open('certificate-retirement-summary.json') as f:
                  data = json.load(f)
              metrics = data.get('metrics', {})
              successes = metrics.get('retirement_success_count', {}).get('count')
              server_errors = metrics.get('retirement_server_error_count', {}).get('count')
              if successes is None or server_errors is None:
                  print('N/A')
                  sys.exit(0)
              print(f'{int(successes)} {int(server_errors)}')
          except Exception as e:
              print(f'ERROR: {e}', file=sys.stderr)
              print('N/A')
          " 2>&1)

          if [ "$RESULT" = "N/A" ] || [ -z "$RESULT" ]; then
            echo "::error::Could not parse retirement results from k6 summary — cannot confirm concurrency safety"
            exit 1
          fi

          SUCCESSES=$(echo "$RESULT" | awk '{print $1}')
          SERVER_ERRORS=$(echo "$RESULT" | awk '{print $2}')

          echo "successes=${SUCCESSES}" >> "$GITHUB_OUTPUT"
          echo "server_errors=${SERVER_ERRORS}" >> "$GITHUB_OUTPUT"

          if [ "$SERVER_ERRORS" -ne 0 ]; then
            echo "::error::Observed ${SERVER_ERRORS} 5xx responses during concurrent retirement — race condition suspected"
            exit 1
          fi

          if [ "$SUCCESSES" -ne 1 ]; then
            echo "::error::Expected exactly 1 successful retirement, observed ${SUCCESSES}"
            exit 1
          fi

          echo "✅ Concurrent retirement safe: exactly 1 success, 0 server errors"

      - name: Add Certificate Retirement Summary
        if: always()
        run: |
          SUCCESSES="${{ steps.enforce_retirement.outputs.successes }}"
          SERVER_ERRORS="${{ steps.enforce_retirement.outputs.server_errors }}"
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Concurrent Certificate Retirement Test

          | Metric | Value |
          |---|---|
          | Target | ${{ github.event.inputs.api_url || 'https://solarproof-staging.vercel.app' }} |
          | Concurrent VUs | 50 |
          | Successful retirements (expected 1) | ${SUCCESSES:-N/A} |
          | Server errors (expected 0) | ${SERVER_ERRORS:-N/A} |

          > Concurrent retirement of the same certificate must yield exactly one success; all other requests must return 409 (or 200 idempotent). No 5xx responses are permitted.
          EOF

      - name: Upload certificate retirement results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certificate-retirement-results-${{ github.run_id }}
          path: certificate-retirement-summary.json
          if-no-files-found: ignore
          retention-days: 30

  load-test:
    name: k6 load test (${{ github.event.inputs.scenario || 'baseline' }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Run load test
        id: run_test
        run: |
          # Output JSON summary to file for regression analysis
          k6 run tests/load/readings.js \
            -e API_URL=${{ github.event.inputs.api_url || 'https://solarproof-staging.vercel.app' }} \
            -e METER_ID=${{ github.event.inputs.meter_id || '00000000-0000-0000-0000-000000000001' }} \
            -e SCENARIO=${{ github.event.inputs.scenario || 'baseline' }} \
            --summary-export=k6-summary.json || true

      - name: P95 Regression Check
        id: regression_check
        run: |
          # Parse P95 from k6 JSON summary
          P95=$(python3 -c "
          import json, sys
          try:
              with open('k6-summary.json') as f:
                  data = json.load(f)
              metrics = data.get('metrics', {})
              # Try custom metric first, fall back to built-in
              p95 = (
                  metrics.get('reading_duration_ms', {}).get('p(95)')
                  or metrics.get('http_req_duration', {}).get('p(95)')
              )
              if p95 is None:
                  print('N/A')
                  sys.exit(0)
              print(f'{p95:.0f}')
          except Exception as e:
              print(f'ERROR: {e}', file=sys.stderr)
              print('N/A')
          " 2>&1)

          echo "p95_ms=${P95}" >> "$GITHUB_OUTPUT"

          if [ "$P95" = "N/A" ] || [ "$P95" = "" ]; then
            echo "::warning::Could not parse P95 from k6 summary — skipping regression check"
            echo "regression=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASELINE=${{ env.P95_BASELINE_MS }}
          THRESHOLD_PCT=${{ env.P95_REGRESSION_PERCENT }}
          # Calculate maximum allowed P95 = baseline * (1 + threshold/100)
          MAX_P95=$(python3 -c "print(int($BASELINE * (1 + $THRESHOLD_PCT / 100)))")

          echo "P95 measured   : ${P95} ms"
          echo "P95 baseline   : ${BASELINE} ms"
          echo "P95 max allowed: ${MAX_P95} ms (baseline + ${THRESHOLD_PCT}%)"
          echo "max_p95_ms=${MAX_P95}" >> "$GITHUB_OUTPUT"

          if [ "$P95" -gt "$MAX_P95" ]; then
            echo "::error::P95 regression detected! ${P95}ms > ${MAX_P95}ms (${BASELINE}ms baseline + ${THRESHOLD_PCT}%)"
            echo "regression=true" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "✅ P95 within acceptable range: ${P95}ms ≤ ${MAX_P95}ms"
            echo "regression=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add Job Summary
        if: always()
        run: |
          P95="${{ steps.regression_check.outputs.p95_ms }}"
          MAX_P95="${{ steps.regression_check.outputs.max_p95_ms }}"
          REGRESSION="${{ steps.regression_check.outputs.regression }}"

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## k6 Load Test Results

          | Metric | Value |
          |---|---|
          | Scenario | ${{ github.event.inputs.scenario || 'baseline' }} |
          | P95 Latency | ${P95:-N/A} ms |
          | Baseline (from PERFORMANCE_BASELINE.md) | ${{ env.P95_BASELINE_MS }} ms |
          | Max Allowed (baseline + ${{ env.P95_REGRESSION_PERCENT }}%) | ${MAX_P95:-N/A} ms |
          | Regression Detected | ${REGRESSION:-unknown} |

          > Baseline documented in [docs/PERFORMANCE_BASELINE.md](../../docs/PERFORMANCE_BASELINE.md).
          > To update the baseline after an intentional performance change, submit a PR updating \`P95_BASELINE_MS\` in this workflow and the table in \`docs/PERFORMANCE_BASELINE.md\`.
          EOF

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ github.event.inputs.scenario || 'baseline' }}-${{ github.run_id }}
          path: |
            k6-summary.json
            '*.json'
          if-no-files-found: ignore
          retention-days: 30
