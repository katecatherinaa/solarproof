name: Blue-Green Deploy

# Closes #63 — smoke test gate before traffic cut-over.
# smoke-test.mjs runs against the green (preview) slot after deployment;
# the promote step only executes if the smoke test exits 0.
# A failed smoke test sends a Slack/email notification and aborts the workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      disable_auto_rollback:
        description: 'Disable automatic rollback on p95 latency spike'
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy → smoke test → promote
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # ── Node / pnpm (required by smoke-test.mjs) ─────────────────────────
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ── Deploy to Vercel preview (green slot) ─────────────────────────────
      - name: Deploy to Vercel preview (green)
        id: deploy
        run: |
          PREVIEW_URL=$(npx vercel deploy --token ${{ secrets.VERCEL_TOKEN }} \
            --scope ${{ secrets.VERCEL_ORG_ID }} \
            --yes 2>&1 | tail -1)
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── Health checks against green ───────────────────────────────────────
      - name: Health checks against green
        run: |
          URL="${{ steps.deploy.outputs.preview_url }}/api/health"
          for i in $(seq 1 5); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "Health check $i passed"
            else
              echo "Health check $i failed (HTTP $STATUS)"
              exit 1
            fi
            sleep 10
          done

      # ── Smoke test against green slot (gate before cut-over) ─────────────
      # Traffic is NOT cut over if this step fails (exit non-zero).
      - name: Run smoke test against green slot
        id: smoke
        run: node scripts/smoke-test.mjs
        env:
          SMOKE_NETWORK:                testnet
          ENERGY_TOKEN_ID:              ${{ secrets.ENERGY_TOKEN_ID }}
          AUDIT_REGISTRY_ID:            ${{ secrets.AUDIT_REGISTRY_ID }}
          SMOKE_METER_SECRET_KEY:       ${{ secrets.SMOKE_METER_SECRET_KEY }}
          SMOKE_TOKEN_MINTER_SECRET_KEY: ${{ secrets.SMOKE_TOKEN_MINTER_SECRET_KEY }}
          # Point the smoke test at the green preview URL
          NEXT_PUBLIC_STELLAR_RPC_URL:  ${{ steps.deploy.outputs.preview_url }}

      # ── Promote green → production (only if smoke test passed) ───────────
      - name: Promote green to production
        run: |
          npx vercel promote ${{ steps.deploy.outputs.preview_url }} \
            --token ${{ secrets.VERCEL_TOKEN }} \
            --scope ${{ secrets.VERCEL_ORG_ID }}

      - name: Verify production health
        run: |
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            "https://solarproof.vercel.app/api/health")
          [ "$STATUS" = "200" ] || (echo "Production health check failed" && exit 1)

      # ── Post-deploy p95 latency monitor (5 min) with auto-rollback ────────
      # Polls production /api/health for 5 minutes, computes p95 latency, and
      # triggers an automatic rollback if p95 > 1000 ms is sustained for more
      # than 2 minutes. Set DISABLE_AUTO_ROLLBACK=true (or the workflow_dispatch
      # input) to disable automatic rollback. Manual rollback runbook:
      # docs/runbook/blue-green-deployment.md
      - name: Monitor p95 latency post-deploy
        id: latency
        run: |
          set -euo pipefail
          URL="https://solarproof.vercel.app/api/health"
          DURATION_SECS=300          # monitor for 5 minutes
          INTERVAL_SECS=10           # sample every 10s
          P95_THRESHOLD_MS=1000      # p95 > 1s is a breach
          SUSTAIN_SECS=120           # breach must be sustained > 2 minutes

          DISABLE_AUTO_ROLLBACK="${{ github.event.inputs.disable_auto_rollback || 'false' }}"
          if [ "${DISABLE_AUTO_ROLLBACK}" = "true" ]; then
            echo "::warning::Automatic rollback is DISABLED (disable_auto_rollback=true)."
          fi

          SAMPLES_FILE="$(mktemp)"
          BREACH_START=0
          BREACH_ACTIVE=0
          ROLLBACK_TRIGGERED=0

          START=$(date +%s)
          while :; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - START))
            [ "$ELAPSED" -ge "$DURATION_SECS" ] && break

            # Measure request latency in milliseconds
            LAT_MS=$(curl -s -o /dev/null -w "%{time_total}" --max-time 10 "$URL" \
              | awk '{printf "%d", $1 * 1000}')
            echo "$LAT_MS" >> "$SAMPLES_FILE"
            echo "t=${ELAPSED}s latency=${LAT_MS}ms"

            # Compute p95 over samples collected so far
            P95=$(sort -n "$SAMPLES_FILE" | awk '
              { a[NR]=$1 }
              END {
                if (NR == 0) { print 0; exit }
                idx = int((NR - 1) * 0.95) + 1
                print a[idx]
              }')
            echo "  p95=${P95}ms (threshold ${P95_THRESHOLD_MS}ms)"

            if [ "$P95" -gt "$P95_THRESHOLD_MS" ]; then
              if [ "$BREACH_ACTIVE" -eq 0 ]; then
                BREACH_ACTIVE=1
                BREACH_START=$NOW
                echo "::warning::p95 latency breach started (p95=${P95}ms)"
              fi
              BREACH_DURATION=$((NOW - BREACH_START))
              echo "  breach sustained for ${BREACH_DURATION}s (limit ${SUSTAIN_SECS}s)"
              if [ "$BREACH_DURATION" -gt "$SUSTAIN_SECS" ]; then
                echo "::error::p95 latency > ${P95_THRESHOLD_MS}ms sustained for > ${SUSTAIN_SECS}s"
                ROLLBACK_TRIGGERED=1
                break
              fi
            else
              if [ "$BREACH_ACTIVE" -eq 1 ]; then
                echo "p95 latency recovered below threshold; breach timer reset"
              fi
              BREACH_ACTIVE=0
              BREACH_START=0
            fi

            sleep "$INTERVAL_SECS"
          done

          FINAL_P95=$(sort -n "$SAMPLES_FILE" | awk '
            { a[NR]=$1 }
            END {
              if (NR == 0) { print 0; exit }
              idx = int((NR - 1) * 0.95) + 1
              print a[idx]
            }')
          echo "final_p95_ms=$FINAL_P95" >> "$GITHUB_OUTPUT"
          echo "rollback_triggered=$ROLLBACK_TRIGGERED" >> "$GITHUB_OUTPUT"

          if [ "$ROLLBACK_TRIGGERED" -eq 1 ]; then
            if [ "${DISABLE_AUTO_ROLLBACK}" = "true" ]; then
              echo "::warning::Latency breach detected but automatic rollback is disabled. Manual rollback required — see docs/runbook/blue-green-deployment.md"
              exit 1
            fi

            echo "::error::Triggering automatic rollback due to sustained p95 latency spike"
            npx vercel rollback \
              --token ${{ secrets.VERCEL_TOKEN }} \
              --scope ${{ secrets.VERCEL_ORG_ID }} \
              --yes || echo "::warning::vercel rollback command failed; manual rollback required"

            # Slack notification for automatic rollback
            if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
              curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
                -H 'Content-Type: application/json' \
                -d "{
                  \"text\": \"🔴 *Automatic rollback triggered* — p95 latency spike post-deployment\",
                  \"attachments\": [{
                    \"color\": \"danger\",
                    \"fields\": [
                      {\"title\": \"p95 latency\", \"value\": \"${FINAL_P95}ms (threshold ${P95_THRESHOLD_MS}ms)\", \"short\": true},
                      {\"title\": \"Sustained\",   \"value\": \"> ${SUSTAIN_SECS}s\", \"short\": true},
                      {\"title\": \"Commit\",      \"value\": \"\`${{ github.sha }}\`\", \"short\": true},
                      {\"title\": \"Actor\",       \"value\": \"\`${{ github.actor }}\`\", \"short\": true},
                      {\"title\": \"Run\",         \"value\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"short\": false},
                      {\"title\": \"Runbook\",     \"value\": \"docs/runbook/blue-green-deployment.md\", \"short\": false}
                    ]
                  }]
                }"
            fi

            echo "## 🔴 Automatic rollback triggered" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "p95 latency exceeded ${P95_THRESHOLD_MS}ms (final: ${FINAL_P95}ms) for more than ${SUSTAIN_SECS}s." >> "$GITHUB_STEP_SUMMARY"
            echo "Production was rolled back to the previous deployment." >> "$GITHUB_STEP_SUMMARY"
            echo "See the [blue-green runbook](../docs/runbook/blue-green-deployment.md) for manual rollback steps." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "p95 latency within threshold (final: ${FINAL_P95}ms)"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── Failure notification (smoke test or deploy failure) ─────────────────────
  notify-failure:
    name: Notify on smoke-test / deploy failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - name: Post failure summary
        run: |
          echo "## ❌ Blue-green deployment FAILED" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Production traffic was **not** cut over. The green slot remains live as a preview." >> "$GITHUB_STEP_SUMMARY"
          echo "See the [blue-green runbook](../docs/runbook/blue-green-deployment.md) for rollback steps." >> "$GITHUB_STEP_SUMMARY"

      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"❌ *Blue-green smoke test FAILED* — production cut-over aborted\",
              \"attachments\": [{
                \"color\": \"danger\",
                \"fields\": [
                  {\"title\": \"Commit\",   \"value\": \"\`${{ github.sha }}\`\",  \"short\": true},
                  {\"title\": \"Actor\",    \"value\": \"\`${{ github.actor }}\`\", \"short\": true},
                  {\"title\": \"Run\",      \"value\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"short\": false},
                  {\"title\": \"Runbook\",  \"value\": \"docs/runbook/blue-green-deployment.md\", \"short\": false}
                ]
              }]
            }"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
